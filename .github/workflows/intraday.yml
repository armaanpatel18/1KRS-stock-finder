name: Refresh Intraday Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 3-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: intraday-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh intraday data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python scripts/update_intraday.py

      - name: Commit updated intraday data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/intraday.json

          if git diff --cached --quiet; then
            echo "No intraday changes."
          else
            git commit -m "chore: refresh intraday scanner"
            git push
          fi
