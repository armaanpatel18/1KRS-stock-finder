name: Refresh Intraday Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 3-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: intraday-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scanner
        run: npm install stock-nse-india

      - name: Update intraday data
        run: node scripts/update_intraday.js

      - name: Commit scanner data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/intraday.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh intraday scanner"
            git push
          fi
